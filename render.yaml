services:
  - type: web
    name: studypal-web
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn studypal.wsgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: studypal.settings
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "studypal.onrender.com"
      # TEMP: enable public migration endpoint; remember to remove/flip to False after use
      - key: MIGRATION_ENDPOINT_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: studypal-db
          property: connectionString
    autoDeploy: true
    plan: free

databases:
  - name: studypal-db
    plan: free 